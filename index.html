<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milly's — Bohemian Fashion &amp; Accessories, Made in Thailand</title>
<meta name="description" content="Explore Milly's Thai bohemian collections, including dresses, tops, kaftans, sets, bags, pants and skirts.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3D332C">
<meta property="og:type" content="website">
<meta property="og:title" content="Milly's — Thai-made collections">
<meta property="og:description" content="Explore seven expressive Milly's collections and browse the full catalogue.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">

<div id="site-header"></div>

<main>
  <section class="collection-hero" id="homeShowcase"
    role="region"
    data-aria-en="Milly's category collections"
    data-aria-th="คอลเลกชันหมวดหมู่ของ Milly's"
    aria-roledescription="carousel">
    <div class="hero-showcase-stage" aria-live="off"></div>

    <button class="hero-showcase-arrow hero-showcase-prev" type="button"
      data-aria-en="Previous collection"
      data-aria-th="คอลเลกชันก่อนหน้า">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <button class="hero-showcase-arrow hero-showcase-next" type="button"
      data-aria-en="Next collection"
      data-aria-th="คอลเลกชันถัดไป">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
    </button>

    <div class="hero-showcase-dots"
      data-aria-en="Choose a collection"
      data-aria-th="เลือกคอลเลกชัน"></div>

    <p class="hero-swipe-hint">
      <span data-lang="en">Swipe to explore</span>
      <span data-lang="th">ปัดเพื่อดูคอลเลกชัน</span>
    </p>
  </section>
</main>

<div id="site-footer"></div>

<script src="/js/site-config.js"></script>
<script src="/js/products.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
