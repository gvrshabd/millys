<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Milly's</title>
<meta name="description" content="Browse Milly's full catalogue of dresses and kaftans, with prices, fabric, and measurements.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="section" style="padding-bottom:0;">
    <div class="container">
      <span class="eyebrow" data-lang="en">Full catalogue</span>
      <span class="eyebrow" data-lang="th">สินค้าทั้งหมด</span>
      <h1 data-lang="en">Shop</h1>
      <h1 data-lang="th">สินค้า</h1>
      <p style="max-width:56ch;" data-lang="en">Every piece listed with real measurements and fabric. Tap any item for full detail and ordering links.</p>
      <p style="max-width:56ch;" data-lang="th">สินค้าทุกชิ้นระบุขนาดและเนื้อผ้าจริง แตะเพื่อดูรายละเอียดและลิงก์สั่งซื้อ</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="category-row">
        <button type="button" class="swatch-pill active" data-category="all">
          <span class="swatch swatch-all"></span>
          <span data-lang="en">All</span><span data-lang="th">ทั้งหมด</span>
        </button>
        <button type="button" class="swatch-pill" data-category="dresses">
          <span class="swatch swatch-dresses"></span>
          <span data-lang="en">Dresses</span><span data-lang="th">เดรส</span>
        </button>
        <button type="button" class="swatch-pill" data-category="kaftans">
          <span class="swatch swatch-kaftans"></span>
          <span data-lang="en">Kaftans</span><span data-lang="th">คาฟตัน</span>
        </button>
      </div>
      <div class="product-grid" id="productGrid"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/js/products.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
